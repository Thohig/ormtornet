<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-t="sidtitel">Ormtornet</title>
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="ikon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="ikon.svg" type="image/svg+xml">
<link rel="icon" href="ikon.png" type="image/png" sizes="180x180">
<link rel="apple-touch-icon" href="ikon.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="spelledare.css">
<style>
  #addr {
    font-size: clamp(14px, 2.6vw, 24px);
    color: var(--hi);
    text-shadow: 0 0 8px var(--glow);
    overflow-wrap: anywhere;
    margin: 6px 0;
  }
  /* På GitHub Pages är adressen länken med rumskoden. */
  body.sida #addr { font-size: clamp(12px, 1.8vw, 16px); }
  #ips { color: var(--fg); }
  #ips span { color: var(--fg); }
  #copied { color: var(--info); min-height: 1.2em; }
  #status { color: var(--hi); }
  #host #status { display: block; } /* inte tecknens flexrad från style.css */
  #status.dead { color: var(--warn); }
  #slots { list-style: none; margin: 10px 0 0; padding: 0; }
  #slots li { display: flex; gap: 12px; margin: 5px 0; }
  #slots .name { flex: 0 0 22ch; }
  #slots .empty { color: var(--faint); }
  #slots .tag { color: var(--fg); }
  #slots .tag.ok { color: var(--info); }
  #slots .tag.away { color: var(--warn); }
  #slots .tag.ai { color: var(--info); }
  #slots li { align-items: baseline; }
  #settings { display: grid; grid-template-columns: 20ch auto 1fr; gap: 8px 12px; align-items: baseline; }
  #settingsHelp summary { color: var(--fg); cursor: pointer; list-style: none; }
  #settingsHelp summary::-webkit-details-marker { display: none; }
  #settingsHelp summary::before { content: "▸ "; }
  #settingsHelp[open] summary::before { content: "▾ "; }
  #settingsHelp summary:hover { color: var(--hi); }
  #settingsHelp dl { margin: 8px 0 0; }
  #settingsHelp dt { color: var(--hi); margin-top: 10px; }
  #settingsHelp dd { margin: 2px 0 0; color: var(--fg); line-height: 1.45; max-width: 70ch; }
  #settings label { color: var(--fg); }
  #settings .note { color: var(--fg); font-size: 12px; }
  #settings select {
    background: var(--bg);
    color: var(--hi);
    border: 1px solid var(--dim);
    font: inherit;
    padding: 3px 6px;
  }
  #settings select { justify-self: start; }
  #settings select:focus-visible { outline: none; border-color: var(--fg); }
  #settings select:disabled { color: var(--dim); border-color: var(--faint); }
  #saved { min-height: 1.2em; color: var(--info); }
  #saved.err { color: var(--warn); }
  #reloadMsg { white-space: pre-wrap; }
  #reloadMsg.err { color: var(--warn); }
  #startHint { color: var(--fg); }
  /* Avsnitten står alltid i samma ordning. Under och efter vandringen
     krymper Bjud in till adressen och en knapp för den som kommer sent, så
     att Vid porten och Inför nästa vandring kommer upp. */
  body.fas-spel #invite .full, body.fas-spel #copyInvite, body.fas-spel:not(.har-vandrare) #joinSelf,
  body.fas-slut #invite .full, body.fas-slut #copyInvite { display: none; }
  body.fas-spel #addr, body.fas-slut #addr { font-size: 15px; }
  body.fas-spel #invite .buttons, body.fas-slut #invite .buttons { margin-top: 6px; }
  /* Under vandringen kan ingen ny komma in och den går inte att starta:
     Vid porten visar bara raden om vandringen och vandrarna. */
  body.fas-spel #slots li.emptyslot, body.fas-spel #towerInfo,
  body.fas-spel #port .buttons, body.fas-spel #startHint { display: none; }
  #foot { margin-top: 20px; }
  #foot h2 { margin-top: 18px; }
  #reloadMsg:empty { display: none; }
  #help li, #helpPages li { margin: 6px 0; line-height: 1.45; }
  #help, #helpPages { padding-left: 1.4em; margin: 0; }
  #help[hidden], #helpPages[hidden] { display: none; }
  #tabWarn { color: var(--warn); }
  #tabWarn[hidden] { display: none; }
</style>
</head>
<body>
<div id="crt">
  <main id="host">
    <h1 data-t="rubrik"></h1>
    <p class="dimtext" data-t="bara_din_dator"></p>
    <p id="tabWarn" data-t="sida_flik" hidden></p>

    <div id="bar">
      <span id="barPhase">…</span>
      <span id="barWho"></span>
      <span id="barBtns">
        <button class="btn main small" id="barMain" type="button" hidden></button>
      </span>
    </div>

    <!-- På en bred skärm två kolumner: till vänster det som händer nu, till
         höger förberedelser och hjälp. Avsnitten står i samma ordning som i
         en kolumn (spelledare.css). -->
    <div id="cols">
      <div class="col" id="colNow">
        <section id="invite">
        <h2 data-t="bjud_in"></h2>
        <p class="full" data-t="bjud_in_text"></p>
        <!-- Adressen syns bara när spelledaren ber om den: det räcker oftast
             att kopiera den, och länken på Pages är lång. -->
        <div id="addrBox" hidden>
          <div id="addr">…</div>
          <p id="ips" class="full"></p>
        </div>
        <div class="buttons">
          <button class="btn main" id="copyInvite" type="button" data-t="kopiera_inbjudan"></button>
          <button class="btn" id="copyAddr" type="button" data-t="kopiera_adressen"></button>
          <button class="btn" id="showAddr" type="button" aria-expanded="false" aria-controls="addrBox" data-t="visa_adressen"></button>
          <a class="btn" id="joinSelf" href="./?spela" data-t="ga_in_sjalv"></a>
        </div>
        <p id="copied"></p>
        </section>

        <section id="port">
        <h2 data-t="vid_porten"></h2>
        <p id="status">…</p>
        <ul id="slots"></ul>
        <p class="dimtext" id="towerInfo"></p>
        <div class="buttons">
          <button class="btn" id="startNow" type="button" data-t="starta_nu"></button>
        </div>
        <p id="startHint" data-t="start_hint"></p>
        </section>
      </div>
      <div class="col" id="colPrep">
        <section id="next">
        <h2 data-t="infor_nasta"></h2>
        <form id="settings" autocomplete="off">
          <label for="sSv" data-t="inst_svarighet"></label>
          <select id="sSv" name="svarighet"></select>
          <span class="note" id="svNote"></span>

          <label for="sAI" data-t="inst_ai"></label>
          <select id="sAI" name="ai"><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option></select>
          <span class="note" id="aiNote"></span>

          <label for="sSprak" data-t="sprak"></label>
          <select id="sSprak" name="sprak">
            <option value="sv" data-t="val_svenska"></option>
            <option value="en" data-t="val_english"></option>
          </select>
          <span class="note" data-t="sprak_not"></span>

          <label for="sRev" data-t="inst_avslojande"></label>
          <select id="sRev" name="avslojande"><option value="1" data-t="val_pa"></option><option value="0" data-t="val_av"></option></select>
          <span class="note" data-t="not_avslojande"></span>

          <label for="sFr" data-t="inst_franvaro"></label>
          <select id="sFr" name="franvaro">
            <option value="0" data-t="val_franvaro_star"></option>
            <option value="1" data-t="val_franvaro_1"></option>
            <option value="2"></option>
            <option value="3"></option>
          </select>
          <span class="note" data-t="not_franvaro"></span>
        </form>
        <p id="saved"></p>
        <p class="dimtext" id="settingsHint" data-t="inst_hint"></p>
        <details id="settingsHelp">
          <summary><span data-t="forkl_rubrik"></span></summary>
          <p data-t="forkl_spelet"></p>
          <dl>
            <dt data-t="inst_svarighet"></dt>
            <dd data-t="forkl_svarighet"></dd>
            <dt data-t="inst_ai"></dt>
            <dd data-t="forkl_ai"></dd>
            <dt data-t="sprak"></dt>
            <dd data-t="forkl_sprak"></dd>
            <dt data-t="inst_avslojande"></dt>
            <dd data-t="forkl_avslojande"></dd>
            <dt data-t="inst_franvaro"></dt>
            <dd data-t="forkl_franvaro"></dd>
          </dl>
        </details>
        </section>

        <section id="foot">
        <details id="helpBox">
        <summary><h2 data-t="hjalp"></h2></summary>
        <ul id="help">
          <li data-t="hjalp_wifi"></li>
          <li data-t-html="hjalp_local"></li>
          <li data-t="hjalp_macos"></li>
          <li data-t="hjalp_tappar"></li>
        </ul>
        <!-- På GitHub Pages: spelarna kommer med länken över WebRTC. -->
        <ul id="helpPages" hidden>
          <li data-t="hjalp_sida_lanken"></li>
          <li data-t="hjalp_sida_natet"></li>
          <li data-t="hjalp_sida_fliken"></li>
          <li data-t="hjalp_sida_tappar"></li>
        </ul>
        </details>

        <details id="reloadBox">
        <summary><h2 data-t="las_om"></h2></summary>
        <p>
          <button class="btn" id="reload" type="button" data-t="las_om"></button>
          <span class="note" data-t="las_om_not"></span>
        </p>
        <p id="reloadMsg"></p>
        </details>

        <h2 data-t="stang"></h2>
        <p class="dimtext">
          <button class="btn small" id="closeTower" type="button" data-t="stang"></button>
          <span data-t="stang_not"></span>
        </p>
        </section>
      </div>
    </div>
  </main>
</div>
<script src="texter/vardsidan.js"></script>
<script src="natet.js"></script>
<script src="texter.js"></script>
<script src="map.js"></script>
<script>
"use strict";
// Texterna står i data/vardsidan.json och hämtas med t("nyckel") (texter.js).
const $ = (id) => document.getElementById(id);
const COLORS = MapView.PLAYER_COLORS;
let view = null;
const openedAt = Date.now();
let helpShown = false;
let closed = false;

// På GitHub Pages kommer spelarna med en länk över internet i stället för
// till en adress på samma wifi (docs/github-pages.md).
const onPages = !!window.ORMTORNET_SIDA;
if (onPages) {
  document.body.classList.add("sida");
  document.querySelector('[data-t="bjud_in_text"]').dataset.t = "bjud_in_text_sida";
  $("copyAddr").dataset.t = "kopiera_lanken";
  document.querySelector('[data-t="stang_not"]').dataset.t = "stang_not_sida";
  $("tabWarn").hidden = false;
  $("help").hidden = true;
  $("helpPages").hidden = false;
  applyTexts();
}

function inviteText(v) {
  let s = t(onPages ? "inbjudan_sida" : "inbjudan", { adress: v.addrs.name });
  if (v.addrs.ips.length) s += "\n\n" + t("inbjudan_ips", { adresser: v.addrs.ips.join("\n") });
  return s;
}

// showAddr visar eller döljer adressen under Bjud in.
function showAddr(show) {
  $("addrBox").hidden = !show;
  $("showAddr").setAttribute("aria-expanded", String(show));
  $("showAddr").dataset.t = (show ? "dolj_" : "visa_") + (onPages ? "lanken" : "adressen");
  applyTexts();
}
$("showAddr").onclick = () => showAddr($("addrBox").hidden);
if (onPages) showAddr(false);

async function copy(text, done) {
  try {
    await navigator.clipboard.writeText(text);
    $("copied").textContent = t(done);
  } catch {
    // Gick det inte att kopiera visas adressen, så att den går att markera.
    showAddr(true);
    $("copied").textContent = t("kopiera_fel");
  }
}

$("copyInvite").onclick = () => view && copy(inviteText(view), "kopierad_inbjudan");
$("copyAddr").onclick = () => view && copy(view.addrs.name, onPages ? "kopierad_lanken" : "kopierad_adressen");

$("closeTower").onclick = async () => {
  if (!confirm(t(onPages ? "stang_fraga_sida" : "stang_fraga"))) return;
  try {
    const r = await fetch("/spelledare/stang", { method: "POST", headers: { "X-Ormtornet": "spelledare" } });
    if (!r.ok) throw new Error(r.status);
    closed = true;
    $("status").textContent = t("status_stangt");
    $("status").classList.add("dead");
    $("closeTower").disabled = true;
  } catch {
    $("copied").textContent = "";
    alert(t("stang_svarar_inte"));
  }
};

// seedText: vandringens frö, för att kunna spela upp samma torn igen (-fro).
function seedText(v) {
  return v.seed ? " " + t("fro", { fro: v.seed }) : "";
}

function statusText(v) {
  const here = v.players.filter((p) => p.online);
  const humans = here.filter((p) => !p.bot);
  const ready = humans.filter((p) => p.ready);
  if (v.phase === "spel") {
    return t("status_spel", { runda: v.round, sol: v.sun, max: v.sunMax }) + seedText(v);
  }
  if (v.phase === "klassval") return t("status_klassval");
  const prefix = v.phase === "slut" ? t("status_slut") + seedText(v) + " " : "";
  if (humans.length === 0) return prefix + t("status_vantar");
  if (here.length < v.minPlayers) {
    return prefix + t("status_vantar_fler", { min: v.minPlayers, har: here.length });
  }
  if (ready.length < humans.length) {
    return prefix + t("status_redo", { redo: ready.length, alla: humans.length });
  }
  return prefix + t("status_alla_redo");
}

function tag(p, phase) {
  if (!p.online) return [t("borta"), "away"];
  if (p.ai) return [t("tagg_ai", { namn: p.name }), "ai"];
  if (p.bot) return [t("tagg_dator"), ""];
  if (phase === "klassval") return p.chosen ? [t("tagg_har_valt"), "ok"] : [t("tagg_valjer"), ""];
  if (phase === "spel") {
    return { ute: [t("ute"), "ok"], forlorad: [t("forlorad"), "away"], dod: [t("dod"), "away"] }[p.status] || [t("tagg_i_tornet"), ""];
  }
  return p.ready ? [t("tagg_redo"), "ok"] : [t("tagg_inte_redo"), ""];
}

function render(v) {
  $("addr").textContent = v.addrs.name;
  const ips = $("ips");
  ips.textContent = "";
  if (v.addrs.ips.length) {
    ips.append(t("ips_om") + " ");
    v.addrs.ips.forEach((a, i) => {
      if (i) ips.append(" " + t("ips_eller") + " ");
      const s = document.createElement("span");
      s.textContent = a;
      ips.append(s);
    });
  }

  $("status").textContent = statusText(v);
  $("status").classList.remove("dead");

  $("towerInfo").textContent = t("torn_info", { storlek: v.size, max: v.sunMax });
  const ul = $("slots");
  ul.textContent = "";
  for (let slot = 0; slot < v.maxPlayers; slot++) {
    const p = v.players.find((q) => q.slot === slot);
    const li = document.createElement("li");
    const name = document.createElement("span");
    name.className = "name";
    if (p) {
      const mark = document.createElement("span");
      mark.textContent = "@ ";
      mark.style.color = COLORS[slot];
      name.append(mark, p.name);
      const [text, cls] = tag(p, v.phase);
      const tg = document.createElement("span");
      tg.className = "tag " + cls;
      tg.textContent = text;
      li.append(name, tg);
      if (p.canTakeOver) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "btn small";
        b.dataset.slot = String(slot);
        b.textContent = t("ai_tar_over");
        li.append(b);
      }
    } else {
      li.className = "emptyslot";
      name.className = "name empty";
      name.textContent = "·  " + t("ledig_plats");
      li.append(name);
    }
    ul.append(li);
  }

  renderSettings(v);

  const humans = v.players.filter((p) => !p.bot && p.online).length;
  const canStart = humans > 0;
  $("startNow").disabled = v.phase === "spel" || !canStart;
  $("startHint").textContent = v.phase === "spel"
    ? t("start_pagar")
    : !canStart
      ? t("start_minst_manniska")
      : t("start_hint_alla");

  renderBar(v, canStart);
  for (const f of ["lobby", "klassval", "spel", "slut"]) document.body.classList.toggle("fas-" + f, v.phase === f);
  // Gå in själv byter till spelarsidan i samma flik. Har spelledaren redan
  // en vandrare heter knappen Till spelet och tar hen tillbaka till den.
  const mine = v.players.some((p) => p.vard);
  document.body.classList.toggle("har-vandrare", mine);
  $("joinSelf").dataset.t = mine ? "till_spelet" : "ga_in_sjalv";
  $("joinSelf").textContent = t($("joinSelf").dataset.t);
  // Kommer ingen människa in en stund efter att sidan öppnades fälls hjälpen
  // ut av sig själv, en gång.
  if (v.phase === "lobby" && humans === 0 && !helpShown && Date.now() - openedAt > 90000) {
    helpShown = true;
    $("helpBox").open = true;
  }

}

// Raden överst: fasen, vilka som är här och knappen som behövs just nu,
// Starta nu före vandringen.

function renderBar(v, canStart) {
  const phase = { lobby: t("rad_lobby"), klassval: t("rad_klassval"), slut: t("rad_slut") }[v.phase] ||
    t("rad_runda", { runda: v.round, sol: v.sun, max: v.sunMax });
  $("barPhase").textContent = v.paused && v.phase === "spel" ? t("rad_pausad", { fas: phase }) : phase;
  const who = $("barWho");
  who.textContent = "";
  const here = v.players.filter((p) => p.online);
  const humans = here.filter((p) => !p.bot).length;
  who.append(t(humans === 1 ? "rad_har_manniska" : "rad_har_manniskor", { antal: humans, ai: here.length - humans }));
  const away = v.players.filter((p) => !p.online && !p.bot).map((p) => p.name);
  if (away.length) {
    const s = document.createElement("span");
    s.className = "away";
    s.textContent = " · " + t("rad_borta", { namn: away.join(", ") });
    who.append(s);
  }
  const b = $("barMain");
  if (v.phase !== "spel") {
    b.hidden = false;
    b.textContent = t("starta_nu");
    b.dataset.act = "starta";
    b.disabled = !canStart;
  } else {
    b.hidden = true;
  }
}

$("barMain").onclick = () => $("startNow").click();

// Inställningarna. Formuläret skrivs inte över medan spelledaren håller på
// med det, eller medan en ändring är på väg till servern.
let saving = false;

// optionTexts: de val i formuläret som har ett tal i texten. De andra
// valen får sina texter av applyTexts.
function optionTexts() {
  [...$("sFr").options].forEach((o) => {
    if (+o.value >= 2) o.text = t("val_franvaro_n", { antal: o.value });
  });
}
optionTexts();

function renderSettings(v) {
  const s = v.settings;
  const form = $("settings");
  const playing = v.phase === "spel";
  form.querySelectorAll("select").forEach((el) => (el.disabled = playing));
  $("settingsHint").textContent = playing ? t("inst_hint_spel") : t("inst_hint");
  $("aiNote").textContent = s.ai > v.bots && !playing ? t("not_ai", { antal: v.bots }) : "";
  const busy = saving || form.contains(document.activeElement);
  const sv = $("sSv");
  const levels = v.svarigheter || [];
  // Byggs om när namnen ändras, till exempel när språket byts. Det görs
  // även när formuläret har fokus (språkvalet har det just då), men valet
  // står kvar.
  if ([...sv.options].map((o) => o.text).join("|") !== levels.map((l) => l.namn).join("|")) {
    const keep = sv.value || s.svarighet;
    sv.innerHTML = "";
    levels.forEach((l) => sv.append(new Option(l.namn, l.id)));
    sv.value = keep;
  }
  if (!busy) sv.value = s.svarighet;
  const level = levels.find((l) => l.id === sv.value);
  $("svNote").textContent = level ? level.beskrivning : "";
  if (busy) return;
  fillForm(s);
}

// fillForm fyller i formuläret med inställningarna s, som de gäller på tornet.
function fillForm(s) {
  $("sAI").value = String(s.ai);
  $("sRev").value = s.avslojande ? "1" : "0";
  const fr = $("sFr");
  if (![...fr.options].some((o) => +o.value === s.franvaro)) {
    fr.append(new Option(t("val_franvaro_n", { antal: s.franvaro }), String(s.franvaro)));
  }
  fr.value = String(s.franvaro);
  $("sSprak").value = s.sprak || "sv";
}

// redraw ritar om det skriptet själv har skrivit, när språket har bytts.
// applyTexts har redan fyllt i det som står i HTML:en.
function redraw() {
  optionTexts();
  if (view) render(view);
}

function post(path, body) {
  return fetch(path, {
    method: "POST",
    headers: { "X-Ormtornet": "spelledare", "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
}

let savedTimer = null;
function say(text, isErr) {
  const el = $("saved");
  el.textContent = text;
  el.classList.toggle("err", !!isErr);
  clearTimeout(savedTimer);
  if (!isErr) savedTimer = setTimeout(() => (el.textContent = ""), 2500);
}

$("settings").addEventListener("change", async () => {
  const s = {
    ai: +$("sAI").value,
    avslojande: $("sRev").value === "1",
    franvaro: +$("sFr").value,
    svarighet: $("sSv").value,
    sprak: $("sSprak").value,
  };
  saving = true;
  try {
    const r = await post("/spelledare/installningar", s);
    const data = await r.json().catch(() => ({}));
    if (!r.ok) say(data.fel || t("inst_fel"), true);
    else if (data.varning) say(data.varning, true);
    else say(data.text || t("sparat"));
    // Tornet kan ha justerat ett val, till exempel frånvaron till högst 10
    // rundor. Visa det genast, även om formuläret har fokus.
    if (data.settings) fillForm(data.settings);
  } catch {
    say(t("svarar_inte"), true);
  }
  saving = false;
});

$("slots").addEventListener("click", async (ev) => {
  const b = ev.target.closest("button[data-slot]");
  if (!b) return;
  b.disabled = true;
  try {
    const r = await post("/spelledare/ta-over", { slot: +b.dataset.slot });
    if (!r.ok) {
      const data = await r.json().catch(() => ({}));
      alert(data.fel || t("ta_over_fel"));
    }
  } catch {
    alert(t("svarar_inte"));
  }
});

// Läs om innehållet: data/ läses och kontrolleras på tornets dator.
$("reload").onclick = async () => {
  const el = $("reloadMsg");
  el.textContent = t("las_om_laser");
  el.classList.remove("err");
  try {
    const r = await post("/spelledare/las-om");
    const data = await r.json().catch(() => ({}));
    el.textContent = r.ok ? data.text : data.fel || t("las_om_fel");
    el.classList.toggle("err", !r.ok);
  } catch {
    el.textContent = t("svarar_inte");
    el.classList.add("err");
  }
};

$("startNow").onclick = async () => {
  try {
    const r = await post("/spelledare/starta");
    if (!r.ok) {
      const data = await r.json().catch(() => ({}));
      alert(data.fel || t("starta_fel"));
    }
  } catch {
    alert(t("svarar_inte"));
  }
};

// Bara en sida som syns på skärmen håller tornet öppet, inte en flik som
// glömts kvar i bakgrunden.
function seenParam() {
  return document.visibilityState === "visible" ? "?synlig" : "";
}

async function poll() {
  if (closed) return;
  try {
    const r = await fetch("/spelledare/status" + seenParam(), { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    view = await r.json();
    if (closed) return;
    // Har tornet bytt språk hämtas nya texter och allt ritas om.
    if (await refreshTexts("vardsidan", view.sprak)) redraw();
    else render(view);
  } catch {
    if (closed) return;
    $("status").textContent = t("status_svarar_inte");
    $("status").classList.add("dead");
  }
  setTimeout(poll, 1000);
}
poll();
</script>
</body>
