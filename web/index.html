<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-t="sidans_titel">Ormtornet</title>
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="ikon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="ikon.svg" type="image/svg+xml">
<link rel="icon" href="ikon.png" type="image/png" sizes="180x180">
<link rel="apple-touch-icon" href="ikon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="crt">
  <section id="start" class="screen active">
    <canvas id="rain" aria-hidden="true"></canvas>
    <div id="flash" aria-hidden="true"></div>
    <div id="intro">
      <h1 id="introTitle" data-t="intro_rubrik"></h1>
      <svg id="scene" viewBox="0 0 680 300" role="img" data-t-aria="intro_bild">
        <defs>
          <clipPath id="horizon"><rect x="0" y="0" width="680" height="240"/></clipPath>
          <filter id="cloudblur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
        </defs>
        <g class="stars">
          <circle cx="90" cy="24" r="1.4"/><circle cx="560" cy="14" r="1.4"/><circle cx="610" cy="70" r="1"/>
          <circle cx="140" cy="96" r="1"/><circle cx="470" cy="44" r="0.9"/><circle cx="230" cy="10" r="0.9"/>
          <circle cx="40" cy="150" r="0.8"/><circle cx="650" cy="160" r="0.8"/>
        </g>
        <g clip-path="url(#horizon)">
          <g id="sun">
            <path d="M210 240 A130 130 0 0 1 470 240 Z" fill="#ff9a5a"/>
            <rect x="200" y="212" width="280" height="7"/>
            <rect x="200" y="188" width="280" height="5"/>
            <rect x="200" y="166" width="280" height="3"/>
          </g>
        </g>
        <g id="clouds" filter="url(#cloudblur)">
          <g class="far">
            <ellipse cx="120" cy="70" rx="170" ry="30"/><ellipse cx="420" cy="52" rx="210" ry="34"/>
            <ellipse cx="700" cy="80" rx="190" ry="28"/><ellipse cx="-120" cy="58" rx="160" ry="26"/>
          </g>
          <g class="near">
            <ellipse cx="260" cy="168" rx="200" ry="26"/><ellipse cx="520" cy="190" rx="230" ry="22"/>
            <ellipse cx="20" cy="150" rx="180" ry="30"/><ellipse cx="790" cy="160" rx="170" ry="26"/>
            <ellipse cx="340" cy="128" rx="150" ry="18"/>
          </g>
        </g>
        <rect x="150" y="240" width="380" height="3" fill="#7d6d4c"/>
        <path id="shadow" d="M352 244 C 400 253, 430 241, 470 251 S 540 263, 584 255"/>
        <g id="tower">
          <path d="M300 90 V62 H313 V74 H323 V62 H337 V74 H347 V62 H357 V74 H367 V62 H380 V90 Z" fill="#d8c391"/>
          <rect x="306" y="88" width="68" height="152" fill="#d8c391"/>
          <g id="scales">
            <path d="M306 108 q8.5 8 17 0 q8.5 8 17 0 q8.5 8 17 0 q8.5 8 17 0"/>
            <path d="M314.5 124 q8.5 8 17 0 q8.5 8 17 0 q8.5 8 17 0"/>
            <path d="M306 140 q8.5 8 17 0 q8.5 8 17 0 q8.5 8 17 0 q8.5 8 17 0"/>
            <path d="M314.5 156 q8.5 8 17 0 q8.5 8 17 0 q8.5 8 17 0"/>
            <path d="M306 172 q8.5 8 17 0 q8.5 8 17 0 q8.5 8 17 0 q8.5 8 17 0"/>
            <path d="M314.5 188 q8.5 8 17 0 q8.5 8 17 0 q8.5 8 17 0"/>
            <path d="M306 204 q8.5 8 17 0 q8.5 8 17 0 q8.5 8 17 0 q8.5 8 17 0"/>
          </g>
          <path id="eye" d="M334 118 Q340 110 346 118 Q340 126 334 118 Z"/>
          <path id="gate" d="M328 240 V224 a12 12 0 0 1 24 0 V240 Z"/>
        </g>
      </svg>
      <p id="rumor"></p>
      <button id="enter" class="waiting" type="button" data-t="intro_ga_in"></button>
      <p id="listen"></p>
      <button id="introBok" type="button" data-t="intro_bok"></button>
    </div>
  </section>

  <!-- Om tornet inte släpper in en, som när det är fullt: felet och en
       knapp tillbaka. Namnet ger tornet (names.go). -->
  <section id="namescreen" class="screen">
    <div id="nameform">
      <div id="nameerr"></div>
      <div class="namebuttons">
        <button type="button" id="back" data-t="namn_tillbaka"></button>
      </div>
    </div>
  </section>

  <section id="classscreen" class="screen">
    <div id="choose">
      <h1 data-t="klassval_rubrik"></h1>
      <p id="chooseLead" data-t="klassval_inledning"></p>
      <p id="chooseStatus" aria-live="polite"></p>
      <div id="cards" role="list"></div>
    </div>
  </section>

  <!-- Krönikan på egen skärm: den som har dött ser sin vandring (app.js, renderChron). -->
  <section id="chronscreen" class="screen">
    <div id="chron">
      <h1 id="chronTitle"></h1>
      <p id="chronLead"></p>
      <p id="chronStatus"></p>
      <div id="chronResults"></div>
      <p id="chronPick" data-t="slut_valj" hidden></p>
      <h2 id="chronStoryHead" data-t="kronika_berattelse" hidden></h2>
      <div id="chronStory" hidden></div>
      <div id="chronEpilog"></div>
      <button type="button" id="chronRestBtn" hidden></button>
      <div id="chronRest">
        <div id="chronCard" class="okort" hidden></div>
        <div id="chronRounds"></div>
        <p id="chronStats"></p>
      </div>
      <p id="chronWait"></p>
      <div id="chronButtons">
        <button type="button" id="chronReplay" hidden data-t="repris_knapp"></button>
        <button type="button" id="chronMap" data-t="vandring_karta"></button>
        <button type="button" id="chronNext" hidden></button>
        <button type="button" id="chronHost" hidden data-t="kronika_vardsidan"></button>
      </div>
    </div>
  </section>

  <section id="game" class="screen">
    <header id="top">
      <span class="title" data-t="topp_titel"></span>
      <span id="solmatare"></span>
      <span id="crew" data-t-aria="topp_vandrarna"></span>
      <span id="turn"></span>
      <span id="vard" hidden></span>
      <button type="button" id="bokBtn" class="touchonly" data-t="bok_knapp"></button>
      <button type="button" id="readyBtn" class="keys" hidden></button>
      <span id="conn"></span>
    </header>
    <div id="main">
      <div id="mapcol">
        <div id="mapbox">
          <canvas id="map"></canvas>
          <p id="mapNone" data-t="karta_utan_webgl" hidden></p>
          <div id="mapleft">
            <div id="roomname" aria-live="polite"></div>
          </div>
          <div id="hud">
            <div class="hudrow">
              <div id="status" data-t-aria="tecken_du"></div>
              <button type="button" id="helpBtn" class="keys" data-t-aria="hjalp_knapp" aria-expanded="false">?</button>
            </div>
            <div id="bag" data-t-aria="tecken_foremal"></div>
          </div>
          <div id="helpbox" class="keys" hidden>
            <h2 data-t="hjalp_rubrik"></h2>
            <div id="help">
              <div data-lage="fri strid" data-t-html="hjalp_ga"></div>
              <div data-lage="fri" data-t-html="hjalp_vanta"></div>
              <div data-lage="strid" data-t-html="hjalp_garden"></div>
              <div data-lage="fri strid" data-t-html="hjalp_sok"></div>
              <div data-lage="fri strid" data-dryck data-t-html="hjalp_drick"></div>
              <div data-lage="strid" data-t-html="hjalp_anfall"></div>
              <div data-lage="viska" data-t-html="hjalp_viska"></div>
              <div data-lage="fri strid annat" data-t-html="hjalp_zoom"></div>
              <div class="widelog" data-t-html="hjalp_minikarta"></div>
              <div class="widelog" data-t-html="hjalp_logg"></div>
              <div data-lage="redo" data-t-html="hjalp_redo"></div>
              <div data-t-html="hjalp_visa"></div>
              <div id="helpBok" class="bokrad" data-t-html="hjalp_bok"></div>
            </div>
            <p class="hint" data-t="hjalp_tips"></p>
          </div>
          <div id="zoom" data-t-aria="zoom_rad">
            <button type="button" id="zoomOut" data-t-aria="zoom_ut">−</button>
            <button type="button" id="zoomName" data-t-title="zoom_vaxla"></button>
            <button type="button" id="zoomIn" data-t-aria="zoom_in">+</button>
          </div>
          <div id="spelkort" class="okort" hidden aria-live="polite"></div>
          <div id="storkort" class="okort" hidden aria-live="assertive"></div>
          <pre id="overlay" hidden></pre>
        </div>
        <div id="nowBlock">
          <div class="panel nowbar">
            <h2 data-t="panel_nu"></h2>
            <div id="me"></div>
            <form id="whisper" autocomplete="off" hidden>
              <input id="whisperText" maxlength="80" spellcheck="false" data-t-placeholder="viska_ruta" data-t-aria="viska_ruta_namn">
              <div class="hint" data-t="viska_tips"></div>
            </form>
          </div>
        </div>
      </div>
      <aside id="side">
        <!-- Knapparna följer läget (data-lage, renderPad i app.js). -->
        <div id="pad" class="touchonly" data-t-aria="knappar">
          <div class="dirs" data-lage="fri strid">
            <button type="button" data-key="ArrowUp" class="n" data-t-aria="knapp_norrut">↑</button>
            <button type="button" data-key="ArrowLeft" class="w" data-t-aria="knapp_vasterut">←</button>
            <button type="button" data-key=" " class="c" data-t-aria="knapp_vanta">·</button>
            <button type="button" data-key="ArrowRight" class="e" data-t-aria="knapp_osterut">→</button>
            <button type="button" data-key="ArrowDown" class="s" data-t-aria="knapp_soderut">↓</button>
          </div>
          <div class="acts">
            <button type="button" data-key=" " class="vanta" data-lage="fri strid" data-t="knapp_vanta"></button>
            <button type="button" data-key="a" data-lage="strid" data-t="knapp_anfall"></button>
            <button type="button" data-key="s" data-lage="fri strid" data-t="knapp_sok"></button>
            <button type="button" data-key="d" data-lage="fri strid" data-dryck data-t="knapp_drick"></button>
            <button type="button" data-key="v" id="padWhisper" data-lage="viska" data-t="knapp_viska"></button>
            <button type="button" data-key="Enter" id="padEnter" class="wide" data-lage="redo" data-t="knapp_redo"></button>
          </div>
        </div>
        <div id="logwrap">
          <div id="log" aria-live="polite"></div>
          <button type="button" id="logNew" hidden data-t="logg_nya"></button>
        </div>
        <!-- På en bred skärm: hela loggen i en låda på kartan (L). -->
        <button type="button" id="logToggle" class="keys" aria-expanded="false"></button>
      </aside>
    </div>
  </section>
  <div id="tip" role="tooltip" hidden></div>
</div>
<!-- Ett kort visat stort, när man klickar på ett minikort (showCardPopup i app.js). -->
<div id="kortvisning" hidden><div id="kortvisningKort" class="okort"></div></div>
<!-- Vandrarens bok (web/bok.js, docs/vandrarens-bok.md). -->
<div id="bok" hidden role="dialog" aria-modal="true" aria-labelledby="bokRubrik">
  <div class="bok-panel">
    <div class="bok-head">
      <h2 id="bokRubrik" data-t="bok_rubrik"></h2>
      <button type="button" id="bokStang" data-t-aria="bok_stang">✕</button>
    </div>
    <div id="bokFlikar" role="tablist"></div>
    <div id="bokSida" tabindex="-1"></div>
  </div>
</div>
<script src="texter/spelarsidan.js"></script>
<script src="natet.js"></script>
<script src="texter.js"></script>
<script src="audio.js"></script>
<script src="iso/iso.js"></script>
<script src="map.js"></script>
<script src="minikarta.js"></script>
<script src="repris.js"></script>
<script src="kort.js"></script>
<script src="bok.js"></script>
<script src="app.js"></script>
</body>
</html>
